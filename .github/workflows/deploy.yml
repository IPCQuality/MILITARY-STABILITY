name: Deploy Shift Handover ke GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Supabase build config
        env:
          CHECK_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://dkyjfoxruqoqlhxrmcac.supabase.co' }}
          CHECK_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$CHECK_KEY" ]; then
            echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY kosong di job build! Pastikan ditambahkan sebagai Repository variable atau Repository secret di GitHub -> Settings -> Secrets and variables -> Actions (BUKAN di menu Environments/github-pages, Codespaces, atau Dependabot)."
            exit 1
          fi
          if echo "$CHECK_KEY" | grep -qE '^["'\'']?sb_secret_'; then
            echo "::error::Key yang terpasang adalah sb_secret_ (rahasia). Ganti dengan Publishable key (sb_publishable_...) atau anon public key dari Supabase -> Project Settings -> API!"
            exit 1
          fi
          echo "Supabase URL siap ($(echo "$CHECK_URL" | sed 's/https:\/\///'))"
          echo "Supabase Publishable Key terdeteksi (${#CHECK_KEY} karakter)."

      - name: Build static bundle (relative paths)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL || 'https://dkyjfoxruqoqlhxrmcac.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Prepare GitHub Pages SPA fallback & .nojekyll
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
