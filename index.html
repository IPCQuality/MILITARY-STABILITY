<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>MILITARY &amp; STABILITY — Shift Handover</title>
    <meta name="description" content="Aplikasi pencatatan dan penerusan laporan pekerjaan antar-shift produksi dengan sinkronisasi Firebase Cloud dan ekspor Excel." />
    <meta property="og:title" content="MILITARY &amp; STABILITY — Shift Handover" />
    <meta property="og:description" content="Aplikasi pencatatan dan penerusan laporan pekerjaan antar-shift produksi dengan sinkronisasi Firebase Cloud dan ekspor Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ms_theme_v1');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            if (meta) meta.setAttribute('content', '#0F766E');
          }
        } catch (e) {}

        function safeGetSession(key) {
          try {
            return sessionStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        function safeSetSession(key, val) {
          try {
            sessionStorage.setItem(key, val);
          } catch (e) {}
        }

        function purgeWorkboxDatabases() {
          try {
            if (!('indexedDB' in window) || typeof indexedDB.databases !== 'function') {
              return Promise.resolve();
            }
            return indexedDB.databases().then(function (dbs) {
              if (!dbs || !dbs.length) return;
              return Promise.allSettled(
                dbs
                  .map(function (db) { return db && db.name; })
                  .filter(function (name) {
                    return typeof name === 'string' && (name.indexOf('workbox') === 0 || name === 'keyval-store');
                  })
                  .map(function (name) {
                    return new Promise(function (resolve) {
                      try {
                        var req = indexedDB.deleteDatabase(name);
                        req.onsuccess = function () { resolve(); };
                        req.onerror = function () { resolve(); };
                        req.onblocked = function () { resolve(); };
                      } catch (e) {
                        resolve();
                      }
                    });
                  })
              );
            }).catch(function () {});
          } catch (e) {
            return Promise.resolve();
          }
        }

        function purgeAllPwaCaches() {
          var jobs = [];

          try {
            if ('serviceWorker' in navigator) {
              var hadController = Boolean(navigator.serviceWorker.controller);
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  if (!regs || !regs.length) return { unregistered: false, hadController: hadController };
                  return Promise.allSettled(regs.map(function (r) { return r.unregister(); })).then(function () {
                    return { unregistered: true, hadController: hadController };
                  });
                }).catch(function () {
                  return { unregistered: false, hadController: false };
                })
              );
            }
          } catch (e) {}

          try {
            if ('caches' in window) {
              jobs.push(
                caches.keys().then(function (keys) {
                  if (!keys || !keys.length) return;
                  return Promise.allSettled(keys.map(function (k) { return caches.delete(k); }));
                }).catch(function () {})
              );
            }
          } catch (e) {}

          jobs.push(purgeWorkboxDatabases());

          return Promise.allSettled(jobs).then(function (results) {
            var swRes = results[0] && results[0].status === 'fulfilled' ? results[0].value : null;
            if (swRes && swRes.hadController && swRes.unregistered && !safeGetSession('ms_sw_purged_v2')) {
              safeSetSession('ms_sw_purged_v2', '1');
              window.location.reload();
            }
          });
        }

        window.__msPurgePwaCaches = purgeAllPwaCaches;
        purgeAllPwaCaches();

        function showBootFallback(reason) {
          if (window.__msBooted) return;
          var rootEl = document.getElementById('root');
          if (!rootEl) return;
          var isDark = document.documentElement.classList.contains('dark');
          rootEl.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Plus Jakarta Sans,system-ui,sans-serif;background:' +
            (isDark ? '#000000' : '#f8fafc') +
            ';color:' +
            (isDark ? '#f4f4f5' : '#0f172a') +
            '">' +
            '<div style="max-width:420px;width:100%;border-radius:16px;padding:24px;border:1px solid ' +
            (isDark ? '#27272a' : '#e2e8f0') +
            ';background:' +
            (isDark ? '#0b0c0e' : '#ffffff') +
            '">' +
            '<p style="margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0f766e">PEMULIHAN APLIKASI</p>' +
            '<h1 style="margin:0 0 8px;font-size:18px;font-weight:700">Halaman gagal dimuat</h1>' +
            '<p style="margin:0 0 14px;font-size:13px;line-height:1.5;color:' +
            (isDark ? '#a1a1aa' : '#475569') +
            '">Terjadi kendala saat memuat skrip atau masih ada sisa cache browser lama. Tekan tombol di bawah untuk membersihkan cache dan memuat ulang.</p>' +
            (reason
              ? '<pre style="margin:0 0 14px;padding:10px;border-radius:10px;font-size:11px;overflow:auto;max-height:110px;white-space:pre-wrap;word-break:break-word;background:' +
                (isDark ? '#121417' : '#f1f5f9') +
                ';color:' +
                (isDark ? '#d4d4d8' : '#334155') +
                '">' +
                String(reason).replace(/[<>&]/g, function (c) {
                  return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
                }) +
                '</pre>'
              : '') +
            '<button id="ms-recover-btn" type="button" style="width:100%;min-height:44px;border:none;border-radius:9999px;background:#0f766e;color:#ffffff;font-size:14px;font-weight:600;cursor:pointer">Bersihkan Cache &amp; Muat Ulang</button>' +
            '</div></div>';

          var btn = document.getElementById('ms-recover-btn');
          if (btn) {
            btn.addEventListener('click', function () {
              Promise.resolve(window.__msPurgePwaCaches && window.__msPurgePwaCaches()).finally(function () {
                try {
                  sessionStorage.removeItem('ms_sw_purged_v1');
                  sessionStorage.removeItem('ms_sw_purged_v2');
                } catch (e) {}
                window.location.replace(window.location.pathname + '?_fresh=' + Date.now());
              });
            });
          }
        }

        window.addEventListener('error', function (ev) {
          if (window.__msBooted) return;
          var msg = (ev && ev.message) || (ev && ev.target && ev.target.src ? 'Gagal memuat modul: ' + ev.target.src : '');
          if (msg) showBootFallback(msg);
        }, true);

        window.setTimeout(function () {
          if (!window.__msBooted) {
            showBootFallback('Aplikasi membutuhkan waktu terlalu lama untuk memulai. Coba bersihkan cache browser.');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-zinc-100 antialiased">
    <div id="root">
      <div class="min-h-screen bg-slate-50 dark:bg-black flex items-center justify-center p-6">
        <div class="text-center flex flex-col items-center gap-2.5">
          <svg width="38" height="38" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="#0F766E" stroke="transparent" stroke-width="1" />
            <path d="M8 21V11L13.5 17L19 11V21" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M21.5 21H24.5" stroke="#5EEAD4" stroke-width="2.6" stroke-linecap="round" />
          </svg>
          <p class="text-sm font-bold text-slate-900 dark:text-zinc-100 tracking-tight">
            MILITARY &amp; STABILITY
          </p>
          <p class="text-xs text-slate-500 dark:text-zinc-400">Memuat aplikasi...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
