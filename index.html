<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>MILITARY &amp; STABILITY — Shift Handover</title>
    <meta name="description" content="Aplikasi pencatatan dan penerusan laporan pekerjaan antar-shift produksi dengan sinkronisasi Firebase Cloud dan ekspor Excel." />
    <meta property="og:title" content="MILITARY &amp; STABILITY — Shift Handover" />
    <meta property="og:description" content="Aplikasi pencatatan dan penerusan laporan pekerjaan antar-shift produksi dengan sinkronisasi Firebase Cloud dan ekspor Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ms_theme_v1');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            if (meta) meta.setAttribute('content', '#0F766E');
          }
        } catch (e) {}

        // Hapus sisa Service Worker & cache PWA lama agar browser tidak terjebak di white screen
        try {
          if ('serviceWorker' in navigator) {
            var hadController = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs || !regs.length) return;
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                var purge = 'caches' in window
                  ? caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    })
                  : Promise.resolve();
                purge.finally(function () {
                  if (hadController && !sessionStorage.getItem('ms_sw_purged_v1')) {
                    sessionStorage.setItem('ms_sw_purged_v1', '1');
                    window.location.reload();
                  }
                });
              });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
