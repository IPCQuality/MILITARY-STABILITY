<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MilStability" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>MILITARY &amp; STABILITY — Shift Handover</title>
    <meta name="description" content="Aplikasi pencatatan dan penerusan laporan pekerjaan antar-shift produksi dengan sinkronisasi Firebase Cloud dan ekspor Excel." />
    <meta property="og:title" content="MILITARY &amp; STABILITY — Shift Handover" />
    <meta property="og:description" content="Aplikasi pencatatan dan penerusan laporan pekerjaan antar-shift produksi dengan sinkronisasi Firebase Cloud dan ekspor Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ms_theme_v1');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            if (meta) meta.setAttribute('content', '#0F766E');
          }
        } catch (e) {}

        // Tangkap event beforeinstallprompt sejak awal sebelum React selesai loading
        window.__deferredPWAInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-available'));
        });
        window.addEventListener('appinstalled', function () {
          window.__deferredPWAInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-install-completed'));
        });

        // Pemulihan otomatis jika cache PWA lama memuat bundle JS yang sudah usang sebelum React mount
        window.__appBooted = false;
        function resetCachesAndReload(forceUiOnly) {
          var alreadyRetried = false;
          try {
            alreadyRetried = Boolean(sessionStorage.getItem('ms_chunk_reload_v1'));
          } catch (e) {}

          function showRecoveryUi() {
            var root = document.getElementById('root');
            if (!root || window.__appBooted) return;
            var isDark = document.documentElement.classList.contains('dark');
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Plus Jakarta Sans,system-ui,sans-serif;background:' +
              (isDark ? '#000' : '#f8fafc') +
              ';color:' +
              (isDark ? '#f4f4f5' : '#0f172a') +
              ';">' +
              '<div style="max-width:420px;width:100%;padding:24px;border-radius:16px;border:1px solid ' +
              (isDark ? '#27272a' : '#e2e8f0') +
              ';background:' +
              (isDark ? '#0b0c0e' : '#ffffff') +
              ';">' +
              '<h1 style="margin:0 0 8px;font-size:18px;font-weight:700;">Gagal Memuat Aplikasi</h1>' +
              '<p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:' +
              (isDark ? '#a1a1aa' : '#475569') +
              ';">Versi cache aplikasi di perangkat kemungkinan sudah usang atau koneksi terputus.</p>' +
              '<button id="ms-boot-recover-btn" type="button" style="width:100%;min-height:44px;border:none;border-radius:9999px;background:#0f766e;color:#ffffff;font-size:14px;font-weight:600;cursor:pointer;">Bersihkan Cache &amp; Muat Ulang</button>' +
              '</div></div>';
            var btn = document.getElementById('ms-boot-recover-btn');
            if (btn) {
              btn.addEventListener('click', function () {
                try {
                  sessionStorage.removeItem('ms_chunk_reload_v1');
                } catch (e) {}
                clearAllAndReload();
              });
            }
          }

          function clearAllAndReload() {
            var jobs = [];
            try {
              if ('serviceWorker' in navigator) {
                jobs.push(
                  navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(
                      regs.map(function (r) {
                        return r.unregister();
                      })
                    );
                  })
                );
              }
              if ('caches' in window) {
                jobs.push(
                  caches.keys().then(function (names) {
                    return Promise.all(
                      names.map(function (n) {
                        return caches.delete(n);
                      })
                    );
                  })
                );
              }
            } catch (e) {}
            Promise.all(jobs).finally(function () {
              window.location.reload();
            });
          }

          if (forceUiOnly || alreadyRetried) {
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', showRecoveryUi);
            } else {
              showRecoveryUi();
            }
            return;
          }

          try {
            sessionStorage.setItem('ms_chunk_reload_v1', '1');
          } catch (e) {}
          clearAllAndReload();
        }

        window.addEventListener(
          'error',
          function (ev) {
            if (window.__appBooted) return;
            var target = ev && ev.target;
            var isScriptLoadError =
              target &&
              target.tagName === 'SCRIPT' &&
              target.getAttribute &&
              target.getAttribute('type') === 'module';
            var msg = (ev && ev.message) || '';
            var isChunkError =
              /loading chunk|failed to fetch dynamically imported module|importing a module script failed/i.test(
                msg
              );
            if (isScriptLoadError || isChunkError) {
              resetCachesAndReload(false);
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
